assumptions:
  - "TS:A-B resistance 30 ohm (coil behind the bridge rectifier): not documented, placeholder for the engineer to confirm"
  - "Utility and generator modelled as ideal 120/208 V three-phase sources; generator start-up curve is set in the bench (S1), the guide only says 'usually about 10 seconds'"
  - "Generator starts while TB/TS 14-15 is closed (Feature 7 closes to start); Feature 8 (TB/TS-16) is not used by the modelled generator"
  - "Controller inputs are ideal voltage and continuity sensing points; internal controller circuits are not modelled"
  - "SE, ER and NR are modelled as contacts only; their coils are inside the controller and driven by the controller logic (S1)"
  - "Optional extension harness 309320-005 (Px/Jx) not modelled: plug P mates directly with jack J"
  - "Customer auxiliary contacts 14A (12-13, 31-32) and 14B (10-11, 29-30), option relay OP1, Features 17 and 6B inputs: documented but not wired on this unit, not modelled"
  - "Strip heater (accessory 44G) and RS-485 (accessory 11BE communications) not modelled"
