name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      - name: Install (locked)
        run: uv sync --frozen --python 3.12

      - name: Tests (offline, no API key; includes the frozen fingerprint pins and the schema checks)
        run: uv run --frozen pytest -q

      - name: Committed results (holdout hash, traces, published tables)
        run: uv run --frozen python scripts/verify_results.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web unit tests and build (locked)
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
